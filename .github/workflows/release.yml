# Build bogyman for every supported target and publish a GitHub release when a
# version tag (v1.2.3, or v1.2.3-beta.1 for a pre-release) is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match the workspace version in Cargo.toml, or the run fails
# before building anything. A stable release also updates the Homebrew tap
# (soleo/homebrew-tap) when the HOMEBREW_TAP_TOKEN secret is set.
#
# Third-party actions are pinned to commit SHAs; the comment after each pin is
# the tag it was resolved from. Bump by resolving a newer tag to its SHA.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check tag and run tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: meta
        name: Compare the tag with Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tag" != "$cargo_version" ]; then
            echo "tag v$tag does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: Build ${{ matrix.target }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p bogyman-cli
      - name: Smoke test the binary
        # Only when the runner can execute the target; the x86_64 macOS build is
        # cross-compiled on an arm64 runner and is checked by its tests job instead.
        run: |
          bin="target/${{ matrix.target }}/release/bogyman"
          case "$(uname -m):${{ matrix.target }}" in
            arm64:aarch64-*|aarch64:aarch64-*|x86_64:x86_64-*) "$bin" version && "$bin" --help > /dev/null ;;
            *) echo "skipping run on a different architecture" ;;
          esac
      - name: Package
        run: |
          set -eu
          name="bogyman-v${{ needs.check.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/bogyman" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"
          cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm *.sha256
          ls -la
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "bogyman v${{ needs.check.outputs.version }}" --generate-notes)
          if [ "${{ needs.check.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*

  homebrew:
    name: Update the Homebrew tap
    needs: [check, release]
    # Pre-releases stay out of the tap; `brew install` should only get stable.
    if: needs.check.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Render the formula and push it to soleo/homebrew-tap
        env:
          GH_TOKEN: ${{ github.token }}
          # A fine-grained token with Contents: write on soleo/homebrew-tap only.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the tap update"
            exit 0
          fi
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/soleo/homebrew-tap.git" tap
          scripts/homebrew-formula.sh "$VERSION" SHA256SUMS > tap/Formula/bogyman.rb
          cd tap
          if git diff --quiet; then
            echo "The formula is already at $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Update bogyman to $VERSION"
          git push
