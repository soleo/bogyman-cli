# Build bogyman for every supported target and publish a GitHub release when a
# version tag (v1.2.3, or v1.2.3-beta.1 for a pre-release) is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match the workspace version in Cargo.toml, or the run fails
# before building anything.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check tag and run tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: Compare the tag with Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tag" != "$cargo_version" ]; then
            echo "tag v$tag does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: Build ${{ matrix.target }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p bogyman-cli
      - name: Smoke test the binary
        # Only when the runner can execute the target; the x86_64 macOS build is
        # cross-compiled on an arm64 runner and is checked by its tests job instead.
        run: |
          bin="target/${{ matrix.target }}/release/bogyman"
          case "$(uname -m):${{ matrix.target }}" in
            arm64:aarch64-*|aarch64:aarch64-*|x86_64:x86_64-*) "$bin" version && "$bin" --help > /dev/null ;;
            *) echo "skipping run on a different architecture" ;;
          esac
      - name: Package
        run: |
          set -eu
          name="bogyman-v${{ needs.check.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/bogyman" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"
          cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm *.sha256
          ls -la
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "bogyman v${{ needs.check.outputs.version }}" --generate-notes)
          if [ "${{ needs.check.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*
